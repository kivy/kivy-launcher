name: Android Integration

on: [push, pull_request]

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  Integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - uses: actions/checkout@v7

      - name: Setup environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify Buildozer
        run: buildozer --help

      - name: Verify Buildozer spec
        run: buildozer init

      - name: SDK, NDK, and p4a download
        shell: bash
        run: |
          sed -i.bak 's/^# *android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i.bak 's/^p4a.branch = master/p4a.branch = develop/' buildozer.spec
          buildozer android p4a -- --help

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y automake libltdl-dev

      - name: Debug Build (APK)
        run: buildozer android debug

      - name: Release Build (APK)
        if: runner.os == 'Linux'
        env:
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: '1'
        run: buildozer android release

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kivy-launcher-${{ runner.os }}-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 14
